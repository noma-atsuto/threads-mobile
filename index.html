<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Threads予約">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Threads予約</title>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="top-title">
      <h1 id="title">Threads予約</h1>
      <p id="sub" class="muted">読み込み中…</p>
    </div>
    <button class="nav-btn refresh-btn" id="refreshBtn" aria-label="最新にする">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" /></svg>
    </button>
  </div>
</header>

<main id="main">
  <section id="view-drafts" class="view active"></section>
  <section id="view-schedule" class="view"></section>
  <section id="view-posted" class="view"></section>
  <section id="view-settings" class="view"></section>
  <section id="view-setup" class="view"></section>
</main>

<nav class="tabbar" id="tabbar" role="tablist">
  <button class="tab active" data-view="drafts" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3" /></svg><span>投稿案<b class="badge" id="badge-drafts" hidden></b></span></button>
  <button class="tab" data-view="schedule" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v5m8-5v5" /></svg><span>予約<b class="badge warn" id="badge-schedule" hidden></b></span></button>
  <button class="tab" data-view="posted" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg><span>投稿済み</span></button>
  <button class="tab" data-view="settings" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M6 6l2 2m8 8 2 2M6 18l2-2m8-8 2-2" /><circle cx="12" cy="12" r="3.2" /></svg><span>設定</span></button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="actions.js"></script>
<script src="app.js"></script>
</body>
</html>
